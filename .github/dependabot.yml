version: 2
updates:
  # Backend dependencies
  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - backend
    commit-message:
      prefix: chore(backend)

  # Web dependencies
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - frontend
    commit-message:
      prefix: chore(web)

  # Flutter app dependencies
  - package-ecosystem: pub
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - android
    commit-message:
      prefix: chore(android)

  # GitHub Actions themselves
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: chore(ci)
