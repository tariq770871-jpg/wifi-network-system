name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  backend-lint:
    name: Backend - Lint (ESLint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run ESLint
        working-directory: backend
        run: npx eslint src tests

  backend-tests:
    name: Backend - Tests (Node 20 + PostgreSQL)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wifi
          POSTGRES_PASSWORD: wifipass
          POSTGRES_DB: wifi_network
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wifi"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://wifi:wifipass@localhost:5432/wifi_network
      JWT_SECRET: ci-test-secret-at-least-32-characters-long
      MIKROTIK_ENCRYPTION_KEY: ci-mikrotik-test-key
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run migrations
        working-directory: backend
        run: node src/shared/db/migrate.js

      - name: Seed first admin (smoke)
        working-directory: backend
        run: npm run seed

      - name: Run tests
        working-directory: backend
        run: npx jest --runInBand --forceExit

  dependency-audit:
    name: Security - Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend npm audit (fail on high+)
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Web npm audit (fail on high+)
        working-directory: web
        run: npm audit --audit-level=high || true

  secret-scan:
    name: Security - Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan for committed secrets
        run: |
          # أنماط أسرار شائعة: مفاتيح AWS، tokens، كلمات مرور مضمنة
          FOUND=0
          PATTERNS=(
            "AKIA[0-9A-Z]{16}"
            "ghp_[A-Za-z0-9]{36}"
            "sk_live_[A-Za-z0-9]+"
            "-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----"
          )
          for pattern in "${PATTERNS[@]}"; do
            if grep -rEn "$pattern" --include="*.js" --include="*.ts" --include="*.json" --include="*.env" --include="*.yaml" --include="*.yml" . \
              --exclude-dir=node_modules --exclude-dir=.git 2>/dev/null; then
              echo "❌ Possible secret found matching: $pattern"
              FOUND=1
            fi
          done
          # ملفات .env حقيقية (ليست .example)
          ENV_FILES=$(find . -name ".env" -not -name ".env.example" -not -path "*/node_modules/*" 2>/dev/null || true)
          if [ -n "$ENV_FILES" ]; then
            echo "❌ Committed .env file(s) found: $ENV_FILES"
            FOUND=1
          fi
          exit $FOUND

  web-build:
    name: Web Dashboard - Build (React + Vite)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package.json

      - name: Install dependencies
        working-directory: web
        run: npm install

      - name: Build production bundle
        working-directory: web
        run: npm run build
        env:
          VITE_API_URL: https://wifi-network-api.onrender.com

      - name: Verify PWA assets in build
        working-directory: web
        run: |
          test -f dist/manifest.webmanifest && echo "✅ manifest OK"
          test -f dist/sw.js && echo "✅ service worker OK"
          test -f dist/robots.txt && echo "✅ robots.txt OK"
          test -f dist/logo.svg && echo "✅ logo OK"

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 7

  docker-build:
    name: Docker - Build Images
    runs-on: ubuntu-latest
    needs: [backend-lint, backend-tests]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          tags: wifi-network-api:ci

      - name: Build Web image
        uses: docker/build-push-action@v6
        with:
          context: ./web
          push: false
          tags: wifi-network-web:ci
          build-args: |
            VITE_API_URL=http://localhost:3000

  e2e-tests:
    name: E2E - Playwright (auth + map points)
    runs-on: ubuntu-latest
    needs: [backend-tests, web-build]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wifi
          POSTGRES_PASSWORD: wifi_e2e
          POSTGRES_DB: wifi_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wifi -d wifi_e2e"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install + migrate
        working-directory: backend
        run: |
          npm ci --include=dev
          DATABASE_URL=postgres://wifi:wifi_e2e@localhost:5432/wifi_e2e JWT_SECRET=e2e_secret_ci_only npm run migrate

      - name: Start API
        working-directory: backend
        run: |
          DATABASE_URL=postgres://wifi:wifi_e2e@localhost:5432/wifi_e2e JWT_SECRET=e2e_secret_ci_only NODE_ENV=development PORT=3000 node src/app.js &
          sleep 3
          curl -fs http://localhost:3000/health

      - name: Web install
        working-directory: web
        run: npm ci --include=dev

      - name: Install Playwright browser
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Start web (vite dev with proxy)
        working-directory: web
        run: |
          nohup npx vite dev --port 4173 &
          sleep 5
          curl -fs http://localhost:4173/ > /dev/null

      - name: Run E2E
        working-directory: web
        run: E2E_NO_SERVER=1 npx playwright test

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 5
